        <style>
        html, body {

        <script src="js/qgis2web_expressions.js"></script>

        <script>
        var labels = [];
            var totalMarkers = 0;
        </script>

        <script>
        var map = L.map('map', {
            preferCanvas: true,
            zoomControl:false, maxZoom:28, minZoom:1
        }).fitBounds([[38.38683659156083,141.1030041657066],[38.553867483433315,141.4874741241571]]);
        var hash = new L.Hash(map);
        map.attributionControl.setPrefix('<a href="https://github.com/qgis2web/qgis2web" target="_blank">qgis2web</a> &middot; <a href="https://leafletjs.com" title="A JS library for interactive maps">Leaflet</a> &middot; <a href="https://qgis.org">QGIS</a>');
        var autolinker = new Autolinker({truncate: {length: 30, location: 'smart'}});

        function removeEmptyRowsFromPopupContent(content, feature) {
         var tempDiv = document.createElement('div');
         tempDiv.innerHTML = content;
         var rows = tempDiv.querySelectorAll('tr');
         for (var i = 0; i < rows.length; i++) {
             var td = rows[i].querySelector('td.visible-with-data');
             var key = td ? td.id : '';
             if (td && td.classList.contains('visible-with-data') && feature.properties[key] == null) {
                 rows[i].parentNode.removeChild(rows[i]);
             }
         }
         return tempDiv.innerHTML;
        }

        function addClassToPopupIfMedia(content, popup) {
            var tempDiv = document.createElement('div');
            tempDiv.innerHTML = content;
            var imgTd = tempDiv.querySelector('td img');
            if (imgTd) {
                var src = imgTd.getAttribute('src');
                if (/\.(jpg|jpeg|png|gif|bmp|webp|avif)$/i.test(src)) {
                    popup._contentNode.classList.add('media');
                    var img = popup._contentNode.querySelector('td img');
                    if (img) {
                        if (img.complete && img.naturalHeight > 0) {
                            popup.update();
                        } else {
                            img.addEventListener('load', function() {
                                popup.update();
                            });
                            img.addEventListener('error', function() {
                                popup.update();
                            });
                        }
                    }
                } else if (/\.(mp3|wav|ogg|aac)$/i.test(src)) {
                    var audio = document.createElement('audio');
                    audio.controls = true;
                    audio.src = src;
                    imgTd.parentNode.replaceChild(audio, imgTd);
                    popup._contentNode.classList.add('media');
                    setTimeout(function() {
                        popup.setContent(tempDiv.innerHTML);
                        popup.update();
                    }, 10);
                } else if (/\.(mp4|webm|ogg|mov)$/i.test(src)) {
                    var video = document.createElement('video');
                    video.controls = true;
                    video.src = src;
                    video.style.width = "400px";
                    video.style.height = "300px";
                    video.style.maxHeight = "60vh";
                    video.style.maxWidth = "60vw";
                    imgTd.parentNode.replaceChild(video, imgTd);
                    popup._contentNode.classList.add('media');
                    video.addEventListener('loadedmetadata', function() {
                        popup.update();
                    });
                    setTimeout(function() {
                        popup.setContent(tempDiv.innerHTML);
                        popup.update();
                    }, 10);
                } else {
                    popup._contentNode.classList.remove('media');
                }
            } else {
                popup._contentNode.classList.remove('media');
            }
        }

        var zoomControl = L.control.zoom({
            position: 'topleft'
        }).addTo(map);
        var bounds_group = new L.featureGroup([]);
        function setBounds() {
        }
        map.createPane('pane__0');
        map.getPane('pane__0').style.zIndex = 400;
        var layer__0 = L.tileLayer('https://cyberjapandata.gsi.go.jp/xyz/std/{z}/{x}/{y}.png', {
            pane: 'pane__0',
            opacity: 1.0,
            attribution: '',
            minZoom: 1,
            maxZoom: 28,
            minNativeZoom: 0,
            maxNativeZoom: 18
        });
        layer__0;
        map.addLayer(layer__0);

        function pop__1(feature, layer) {
            var popupContent = '<table>\
                    <tr>\
                        <td colspan="2">' + (feature.properties['id'] !== null ? autolinker.link(String(feature.properties['id']).replace(/'/g, '\'').toLocaleString()) : '') + '</td>\
                    </tr>\
                    <tr>\
                        <td colspan="2">' + (feature.properties['jichitai'] !== null ? autolinker.link(String(feature.properties['jichitai']).replace(/'/g, '\'').toLocaleString()) : '') + '</td>\
                    </tr>\
                    <tr>\
                        <td colspan="2">' + (feature.properties['oaza'] !== null ? autolinker.link(String(feature.properties['oaza']).replace(/'/g, '\'').toLocaleString()) : '') + '</td>\
                    </tr>\
                    <tr>\
                        <td colspan="2">' + (feature.properties['koaza'] !== null ? autolinker.link(String(feature.properties['koaza']).replace(/'/g, '\'').toLocaleString()) : '') + '</td>\
                    </tr>\
                </table>';
            var content = removeEmptyRowsFromPopupContent(popupContent, feature);
			layer.on('popupopen', function(e) {
				addClassToPopupIfMedia(content, e.popup);
			});
			layer.bindPopup(content, { maxHeight: 400 });
        }

        function style__1_0(feature) {
            switch(String(feature.properties['oaza'])) {
                case '蛇田':
                    return { pane: 'pane__1', opacity: 1, color: 'rgba(0,0,0,1.0)', dashArray: '', lineCap: 'butt', lineJoin: 'miter', weight: 1.0, fill: true, fillOpacity: 0.5, fillColor: 'rgba(43,171,217,1.0)', interactive: true }
                    break;
                case '石巻':
                    return { pane: 'pane__1', opacity: 1, color: 'rgba(35,35,35,1.0)', dashArray: '', lineCap: 'butt', lineJoin: 'miter', weight: 1.0, fill: true, fillOpacity: 0.5, fillColor: 'rgba(251,154,153,1.0)', interactive: true }
                    break;
                case '門脇':
                    return { pane: 'pane__1', opacity: 1, color: 'rgba(35,35,35,1.0)', dashArray: '', lineCap: 'butt', lineJoin: 'miter', weight: 2.0, fill: true, fillOpacity: 0.5, fillColor: 'rgba(208,228,45,1.0)', interactive: true }
                    break;
                default:
                    return { pane: 'pane__1', opacity: 1, color: 'rgba(35,35,35,1.0)', dashArray: '', lineCap: 'butt', lineJoin: 'miter', weight: 1.0, fill: true, fillOpacity: 0.5, fillColor: 'rgba(230,119,154,1.0)', interactive: true }
                    break;
                case '前谷地':
                    return { pane: 'pane__1', opacity: 1, color: 'rgba(35,35,35,1.0)', dashArray: '', lineCap: 'butt', lineJoin: 'miter', weight: 1.0, fill: true, fillOpacity: 0.5, fillColor: 'rgba(174,169,35,1.0)', interactive: true }
                    break;
                case '番外':
                    return { pane: 'pane__1', opacity: 1, color: 'rgba(35,35,35,1.0)', dashArray: '', lineCap: 'butt', lineJoin: 'miter', weight: 1.0, fill: true, fillOpacity: 0.5, fillColor: 'rgba(0,0,0,1.0)', interactive: true }
                    break;
            }
        }
        map.createPane('pane__1');
        map.getPane('pane__1').style.zIndex = 401;
        map.getPane('pane__1').style['mix-blend-mode'] = 'normal';
        var layer__1 = new L.geoJson(json__1, {
            attribution: '',
            interactive: true,
            dataVar: 'json__1',
            layerName: 'layer__1',
            pane: 'pane__1',
            onEachFeature: pop__1,
            style: style__1_0,
        });
        bounds_group.addLayer(layer__1);
        map.addLayer(layer__1);

        function pop__2(feature, layer) {
            var popupContent = '<table>\
                    <tr>\
                        <th scope="row">fid</th>\
                        <td class="visible-with-data" id="fid">' + (feature.properties['fid'] !== null ? autolinker.link(String(feature.properties['fid']).replace(/'/g, '\'').toLocaleString()) : '') + '</td>\
                    </tr>\
                    <tr>\
                        <th scope="row">jichitai</th>\
                        <td>' + (feature.properties['jichitai'] !== null ? autolinker.link(String(feature.properties['jichitai']).replace(/'/g, '\'').toLocaleString()) : '') + '</td>\
                    </tr>\
                </table>';
            var content = removeEmptyRowsFromPopupContent(popupContent, feature);
			layer.on('popupopen', function(e) {
				addClassToPopupIfMedia(content, e.popup);
			});
			layer.bindPopup(content, { maxHeight: 400 });
        }

        function style__2_0() {
            return {
                pane: 'pane__2',
                radius: 4.0,
                opacity: 1,
                color: 'rgba(35,35,35,1.0)',
                dashArray: '',
                lineCap: 'butt',
                lineJoin: 'miter',
                weight: 1,
                fill: true,
                fillOpacity: 1,
                fillColor: 'rgba(225,89,137,1.0)',
                interactive: true,
            }
        }
        map.createPane('pane__2');
        map.getPane('pane__2').style.zIndex = 402;
        map.getPane('pane__2').style['mix-blend-mode'] = 'normal';
        var layer__2 = new L.geoJson(json__2, {
            attribution: '',
            interactive: true,
            dataVar: 'json__2',
            layerName: 'layer__2',
            pane: 'pane__2',
            onEachFeature: pop__2,
            pointToLayer: function (feature, latlng) {
                var context = {
                    feature: feature,
                    variables: {}
                };
                return L.circleMarker(latlng, style__2_0(feature));
            },
        });
        bounds_group.addLayer(layer__2);
        map.addLayer(layer__2);

        map.on("zoomend", function(){
            if (map.hasLayer(layer__1)) {
                if (map.getZoom() >= 15 && map.getZoom() <= 19) {
                    layer__1.eachLayer(function (layer) {
                        if (layer.getLatLngs && layer.getLatLngs().length > 0) {
                            layer.openTooltip();
                        }
                    });
                } else {
                    layer__1.eachLayer(function (layer) {
                        layer.closeTooltip();
                    });
                }
            }
            if (map.hasLayer(layer__2)) {
                if (map.getZoom() >= 11 && map.getZoom() <= 14) {
                    layer__2.eachLayer(function (layer) {
                        if (layer.getLatLng) {
                            layer.openTooltip();
                        }
                    });
                } else {
                    layer__2.eachLayer(function (layer) {
                        layer.closeTooltip();
                    });
                }
            }
        });
        setBounds();

        var i = 0;
        layer__1.eachLayer(function(layer) {
            if (!layer.getLatLngs || layer.getLatLngs().length === 0) return;
            var context = {
                feature: layer.feature,
                variables: {}
            };
            layer.bindTooltip((layer.feature.properties['koaza'] !== null?String('<div style="color: #000000; font-size: 10pt; font-family: \'Cambria\', sans-serif;">' + layer.feature.properties['koaza']) + '</div>':''), {permanent: true, direction: 'center', offset: [0, 0], className: 'css__1'});
            labels.push(layer);
            totalMarkers += 1;
              layer.added = true;
              addLabel(layer, i);
              i++;
        });

        var i = 0;
        layer__2.eachLayer(function(layer) {
            var context = {
                feature: layer.feature,
                variables: {}
            };
            layer.bindTooltip((layer.feature.properties['jichitai'] !== null?String('<div style="color: #323232; font-size: 25pt; font-weight: bold; font-family: \'Noto Serif JP Black\', sans-serif;">' + layer.feature.properties['jichitai']) + '</div>':''), {permanent: true, direction: 'center', offset: [0, 0], className: 'css__1'});
            labels.push(layer);
            totalMarkers += 1;
              layer.added = true;
              addLabel(layer, i);
              i++;
        });

        if (map.hasLayer(layer__1)) {
            if (map.getZoom() >= 15 && map.getZoom() <= 19) {
                layer__1.eachLayer(function (layer) {
                    if (layer.getLatLngs && layer.getLatLngs().length > 0) {
                        layer.openTooltip();
                    }
                });
            } else {
                layer__1.eachLayer(function (layer) {
                    layer.closeTooltip();
                });
            }
        }
        if (map.hasLayer(layer__2)) {
            if (map.getZoom() >= 11 && map.getZoom() <= 14) {
                layer__2.eachLayer(function (layer) {
                    if (layer.getLatLng) {
                        layer.openTooltip();
                    }
                });
            } else {
                layer__2.eachLayer(function (layer) {
                    layer.closeTooltip();
                });
            }
        }

        // resetLabels([layer__1,layer__2]);
        // map.on("zoomend", function(){
        //     resetLabels([layer__1,layer__2]);
        // });
        // map.on("layeradd", function(){
        //     resetLabels([layer__1,layer__2]);
        // });
        // map.on("layerremove", function(){
        //     resetLabels([layer__1,layer__2]);
        // });
        </script>
